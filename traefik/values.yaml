# =========================================================
# Traefik Helm values.yaml
# Chart: traefik v37.4.x (stable)
# Kubernetes: EKS 1.33
# Migrated from: Traefik v2.9.4 (294)
# =========================================================

image:
  registry: docker.io
  repository: traefik
  pullPolicy: IfNotPresent

hub:
  enabled: false
  namespaces: []

oci_meta:
  enabled: false  

# ---------------------------------------------------------
# DEPLOYMENT
# ---------------------------------------------------------
deployment:
  enabled: true
  kind: Deployment
  replicas: 5
  terminationGracePeriodSeconds: 60
  minReadySeconds: 0
  annotations: {}
  labels: {}
  podAnnotations: {}
  podLabels: {}
  additionalContainers: []
  additionalVolumes: []
  initContainers: []
  shareProcessNamespace: false
  imagePullSecrets: []
  lifecycle: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 2

podDisruptionBudget:
  enabled: false

# ---------------------------------------------------------
# RESOURCES  ✅ (FIXED)
# ---------------------------------------------------------
resources:
  requests:
    cpu: 1000m
    memory: 1800Mi
  limits:
    cpu: 1400m
    memory: 2000Mi

# ---------------------------------------------------------
# INGRESS CLASS
# ---------------------------------------------------------
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# ---------------------------------------------------------
# EXPERIMENTAL / GATEWAY API
# ---------------------------------------------------------
experimental:
  plugins:
    enabled: false
  kubernetesGateway:
    enabled: false
    gateway:
      enabled: true

# ---------------------------------------------------------
# PROVIDERS
# ---------------------------------------------------------
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    allowExternalNameServices: false
    allowEmptyServices: false
    namespaces: []
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: false
    allowEmptyServices: false
    namespaces: []
    publishedService:
      enabled: false   # REQUIRED for EKS/NLB
  kubernetesIngressNginx:
    enabled: false
    namespaces: [] 
  kubernetesGateway:
    enabled: false
    namespaces: [] 
  knative:
    enabled: false
    namespaces: []      

# ---------------------------------------------------------
# DASHBOARD / GUI ✅ ENABLED
# ---------------------------------------------------------
api:
  dashboard: true

ports:
  traefik:
    port: 9000
    expose:
      default: false
    exposedPort: 9000
    protocol: TCP

ingressRoute:
  dashboard:
    enabled: true
    matchRule: PathPrefix(`/dashboard`) || PathPrefix(`/api`)
    entryPoints:
      - traefik
    middlewares: []   # ⚠️ add auth middleware in prod

# ---------------------------------------------------------
# HEALTH CHECKS
# ---------------------------------------------------------
readinessProbe:
  failureThreshold: 1
  initialDelaySeconds: 2
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 2

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 2
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 2

# ---------------------------------------------------------
# LOGGING
# ---------------------------------------------------------
logs:
  general:
    level: ERROR
  access:
    enabled: false
    filters: {}
    fields:
      general:
        defaultmode: keep
      headers:
        defaultmode: drop

# ---------------------------------------------------------
# METRICS / MONITORING
# ---------------------------------------------------------
metrics:
  addInternals: true
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    service:
      enabled: true

# ---------------------------------------------------------
# GLOBAL / EXTRA ARGS
# ---------------------------------------------------------
globalArguments:
  - --global.checknewversion
  - --global.sendanonymoususage

additionalArguments: []

env: []
envFrom: []

# ---------------------------------------------------------
# ENTRYPOINTS
# ---------------------------------------------------------
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    redirectTo:
      port: websecure

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100
    protocol: TCP

# ---------------------------------------------------------
# SERVICE (AWS EKS NLB – IP MODE)
# ---------------------------------------------------------
service:
  enabled: true
  single: true
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "classic"
    # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    # service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  labels: {}
  spec: {}

# ---------------------------------------------------------
# AUTOSCALING (HPA)
# ---------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 18
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

# ---------------------------------------------------------
# STORAGE
# ---------------------------------------------------------
persistence:
  enabled: false
  name: data
  accessMode: ReadWriteOnce
  size: 128Mi
  path: /data

# ---------------------------------------------------------
# RBAC / SECURITY
# ---------------------------------------------------------
rbac:
  enabled: true
  namespaced: false

serviceAccount:
  name: traefik

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

podSecurityContext:
  fsGroup: 65532

# ---------------------------------------------------------
# SCHEDULING
# ---------------------------------------------------------
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""

extraObjects: []
